<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login with Discord · Custom RPC</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a10;
      --card-bg: rgba(20, 22, 34, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #5865F2;
      --accent-hover: #4752C4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Background Ambient Glowing Blobs */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      pointer-events: none;
      animation: float 10s ease-in-out infinite alternate;
    }
    .blob-1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #5865F2, #818cf8);
      top: -100px;
      left: -100px;
    }
    .blob-2 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, #7c3aed, #a855f7);
      bottom: -150px;
      right: -100px;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(30px) scale(1.08); }
    }

    .card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      padding: 44px 32px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(88, 101, 242, 0.15);
      animation: enter 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.25), rgba(124, 58, 237, 0.25));
      border: 1px solid rgba(88, 101, 242, 0.4);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #5865F2;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(88, 101, 242, 0.3);
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: #ffffff;
    }

    p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-discord {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.96rem;
      font-weight: 600;
      border-radius: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(88, 101, 242, 0.4);
    }

    .btn-discord:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(88, 101, 242, 0.55);
    }

    .btn-discord:active {
      transform: scale(0.98);
    }

    .badge-secure {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.76rem;
      color: #64748b;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="card">
    <div class="icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
      </svg>
    </div>

    <h1>เข้าสู่ระบบเพื่อใช้งาน</h1>
    <p>ระบบความปลอดภัยระดับเซิร์ฟเวอร์ กรุณายืนยันตัวตนผ่านบัญชี Discord ก่อนเข้าสู่หน้าควบคุม Dashboard</p>

    <div id="errorAlert" style="display:none; padding:12px; border-radius:10px; background:rgba(239,68,68,0.2); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; font-size:0.85rem; margin-bottom:20px; line-height:1.4;"></div>

    <a id="loginBtnLink" href="/api/auth/discord/login" class="btn-discord">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      <span>Login with Discord</span>
    </a>

    <script>
      // ตรวจจับ Origin ต้นทางของเบราว์เซอร์อัตโนมัติ (ไม่ว่าจะเป็น http://127.0.0.1:3000 หรือ https://your-node.onrender.com)
      (function() {
        const btn = document.getElementById('loginBtnLink');
        if (btn) {
          const currentOrigin = window.location.origin;
          btn.href = '/api/auth/discord/login?client_origin=' + encodeURIComponent(currentOrigin);
        }
      })();

    <script>
      const params = new URLSearchParams(window.location.search);
      const err = params.get('error');
      if (err) {
        const box = document.getElementById('errorAlert');
        box.style.display = 'block';
        if (err.includes('rate limits') || err.includes('blocked')) {
          box.innerHTML = '⚠️ <strong>เซิร์ฟเวอร์ติด Rate Limit จาก Discord ชั่วคราว</strong><br>กรุณารอสัก 2-3 นาที หรือกดปุ่ม <em>Restart Service</em> บน Render เพื่อเปลี่ยน IP แล้วลองใหม่อีกครั้งครับ';
        } else {
          box.textContent = '❌ การเข้าสู่ระบบล้มเหลว: ' + err;
        }
      }
    </script>

    <div class="badge-secure">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Server-Side Protection · 30-Day Session</span>
    </div>
  </div>
</body>
</html>
